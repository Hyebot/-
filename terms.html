  <h1>서비스 약관</h1>
  <p>이 디스코드 봇은 사용자에게 다양한 기능을 제공하기 위한 용도로 제작되었습니다.</p>
  <p>본 서비스는 예고 없이 변경되거나 종료될 수 있으며, 사용자는 언제든지 이용을 중단할 수 있습니다.</p>
  <p>이용자는 본 서비스를 사용하는 동안 디스코드의 이용 약관을 준수해야 하며, 봇을 악용하거나 다른 사용자에게 피해를 주는 행위를 해서는 안 됩니다.</p>
  <p>본 약관은 필요에 따라 변경될 수 있으며, 변경 사항은 본 페이지를 통해 공지됩니다.</p>
